[project]
name = "calibre-web-overrides"
version = "0.1.0"
description = "Drop-in Open Library author profile provider for Calibre-Web"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31,<3",
    "markdown2>=2.4.12,<3",
    "nh3>=0.2.18,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/calibre_web_overrides"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "live: makes live Open Library requests and prints a report table",
]
